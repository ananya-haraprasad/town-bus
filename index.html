<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Town Bus Hits</title>
  <meta name="description" content="A ride down memory lane." />
  <!-- what people see when the link is shared -->
  <meta property="og:title" content="Town Bus Hits" />
  <meta property="og:description" content="A ride down memory lane." />
  <meta property="og:image" content="assets/day.jpg" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚌</text></svg>" />
  <link rel="preconnect" href="https://www.youtube.com" />
  <link rel="preconnect" href="https://i.ytimg.com" />
  <link rel="dns-prefetch" href="https://www.google.com" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="day">

<!-- ======== THE BUS ======== -->
<div id="stage">
  <img id="art-day" src="assets/day.jpg?v=2" decoding="async" alt="Inside a Tamil Nadu town bus, daytime — conductor with a whistle, passengers seated, palm trees and fields through the windows" />
  <img id="art-night" src="assets/night.jpg?v=2" decoding="async" alt="The same bus at night — moonlit road ahead, warm lamp glow by the shrine" />

  <!-- things you can touch (small targets last, so they sit on top) -->
  <button id="hot-engine" class="hotspot" data-label="இன்ஜின் · engine" aria-label="toggle the engine hum" aria-pressed="false"></button>
  <button id="hot-whistle" class="hotspot" data-label="விசில் · whistle" aria-label="blow the conductor's whistle"></button>
  <button id="hot-horn" class="hotspot" data-label="ஹாரன் · horn" aria-label="sound the bus horn"></button>
</div>

<!-- film grain over the painting -->
<div id="grain" aria-hidden="true"></div>

<!-- ======== TOP ======== -->
<header>
  <nav id="links">
    <a id="link-spotify" target="_blank" rel="noopener" title="Spotify playlist" aria-label="open the bus playlist on Spotify" hidden>
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.6 0 12 0zm5.5 17.3c-.2.4-.7.5-1 .3-2.9-1.8-6.5-2.2-10.8-1.2-.4.1-.8-.2-.9-.6-.1-.4.2-.8.6-.9 4.7-1.1 8.7-.6 11.9 1.4.3.2.4.7.2 1zm1.5-3.3c-.3.4-.8.6-1.3.3-3.3-2-8.3-2.6-12.2-1.4-.5.1-1-.1-1.2-.6-.1-.5.1-1 .6-1.2 4.4-1.3 9.9-.7 13.7 1.6.5.3.6.9.4 1.3zm.1-3.4C15.2 8.3 8.7 8.1 4.9 9.2c-.6.2-1.2-.2-1.4-.7-.2-.6.2-1.2.7-1.4 4.4-1.3 11.5-1 16 1.7.5.3.7 1 .4 1.5-.3.4-1 .6-1.5.3z"/></svg>
    </a>
    <a id="link-ytmusic" target="_blank" rel="noopener" title="YouTube Music playlist" aria-label="open the bus playlist on YouTube Music" hidden>
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M12 0C5.383 0 0 5.383 0 12s5.383 12 12 12 12-5.383 12-12S18.617 0 12 0zm0 19.2A7.2 7.2 0 1 1 19.2 12 7.208 7.208 0 0 1 12 19.2zm0-13.2A6 6 0 1 0 18 12a6.007 6.007 0 0 0-6-6zM9.6 15.6V8.4L15.6 12z"/></svg>
    </a>
    <button id="daynight" aria-label="switch to night" aria-pressed="false">
      <span class="dn-halo" aria-hidden="true"></span>
      <span class="dn-glass" aria-hidden="true">
        <span class="dn-sun"></span>
        <span class="dn-moon"></span>
      </span>
    </button>
  </nav>
</header>

<!-- ======== PLAYER ======== -->
<div id="playerdock">
  <div id="dockrow">
    <div id="pill">
      <img id="thumb" alt="" width="54" height="54" />
      <div id="meta">
        <span id="song-title">பாட்டு ஏறுது…</span>
        <span id="song-sub">boarding</span>
      </div>
      <div id="controls">
        <button id="btn-prev" title="previous" aria-label="previous song">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9.5 12z"/></svg>
        </button>
        <button id="btn-play" title="play / pause" aria-label="play or pause">
          <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>
          <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.5 4.5h3.6v15H6.5zM13.9 4.5h3.6v15h-3.6z"/></svg>
        </button>
        <button id="btn-next" title="next" aria-label="next song">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5v14l10.5-7z"/></svg>
        </button>
      </div>
      <div id="seekbox">
        <span id="t-now">0:00</span>
        <input id="seek" type="range" min="0" max="100" value="0" step="0.1" aria-label="seek" />
        <span id="t-total">0:00</span>
      </div>
    </div>
    <div id="riders" aria-live="polite" aria-label="உடன் பயணிகள் 14">
      <span id="riders-dot" aria-hidden="true"></span>
      <span id="riders-label">உடன் பயணிகள்</span>
      <b id="riders-n">14</b>
    </div>
  </div>
</div>

<footer id="credit">
  Inspired by <a href="https://saloon.wtf" target="_blank" rel="noopener">Deluxe Saloon</a>
  by <a href="https://x.com/ybhrdwj" target="_blank" rel="noopener">Yash Bhardwaj</a>
  · songs play via YouTube
</footer>

<div id="yt-hide"><div id="yt"></div></div>

<script src="songs.js"></script>
<script src="content.js"></script>
<script src="app.js"></script>
</body>
</html>
